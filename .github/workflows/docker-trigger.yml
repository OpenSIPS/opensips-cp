name: Trigger OpenSIPS Control Panel Docker Image build and publish

on:
  push:
  repository_dispatch:
  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:
    - name: Set docker-tag variable
      run:  BRANCH="${GITHUB_REF#refs/heads/}"; echo -e "BRANCH=$BRANCH\nDOCKER_TAG=${BRANCH//master/latest}" >> $GITHUB_ENV
    
    - name: Workflow Dispatch
      uses: actions/github-script@v8
      with:
        github-token: ${{ secrets.OPENSIPS_WORKFLOW_DISPATCH }}
        script: |
          await github.rest.actions.createWorkflowDispatch({
            owner: 'OpenSIPS',
            repo: 'docker-opensips-cp',
            workflow_id: 'docker-image.yml',
            ref: 'main',
            inputs: {
              docker_tag: process.env.DOCKER_TAG,
              branch: process.env.BRANCH
            }
          });
